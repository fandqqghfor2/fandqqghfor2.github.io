<!DOCTYPE html>
  <html>
    <head>
      <meta charset="UTF-8" />
      <title>这里是标题！</title>
      <style id="mainstyle">
        body {
  font-size:20px;
}
        button.darkmode {
          font-size:50px;
          position:absolute;
          top:0px;
          left:0px;
          display:flex;
          width:300px;
          height:125px;
          border-style:soild;
          border-width:8px;
          border-color:rgb(220,110,110);
          border-radius:50px;
          background-color:rgb(145,145,145);
          color:rgb(220,110,110);
        }
      </style>
      <script>
        var body = document.body;
        var BodyStyle = body.style.backgroundColor;
        function turnmode(){
          if(BodyStyle == "white"){
             body.style.backgroundColor = "black";
             body.style.color = "white";

          }
          else if(BodyStyle == "black"){
             body.style.backgroundColor = "white";
             body.style.color = "black";
          }
          else {window.alert("直接报错！有什么好说的！");}}
      </script>
    </head>
    <body style="background-color:white;color:black;">
      <button class="darkmode" onclick="turnmode();">Turn Mode</button>
    </body>
  </html>
